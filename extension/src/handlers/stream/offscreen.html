<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SuperSurf Live Preview Offscreen</title>
</head>
<body>
  <!-- Keep elements in layout (1×1) — display:none can starve video decode / canvas capture. -->
  <video id="tab-video" autoplay muted playsinline width="1" height="1" style="position:fixed;left:0;top:0;opacity:0;pointer-events:none"></video>
  <canvas id="composite" width="1" height="1" style="position:fixed;left:0;top:0;opacity:0;pointer-events:none"></canvas>
  <script type="module" src="offscreen.js"></script>
</body>
</html>
